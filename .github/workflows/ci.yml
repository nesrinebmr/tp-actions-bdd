
name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tp"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          pip install -r python-app/requirements.txt

      - name: Initialiser la base de données
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d tp -f db/init.sql

      - name: Lancer les tests
        working-directory: python-app
        run: pytest -v
